services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mortein
      POSTGRES_USER: mortein
      POSTGRES_PASSWORD: mortein
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mortein-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortein -d mortein"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mortein-postgres:
